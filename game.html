<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排球少年！烏野三年級生飛吧！全國大賽大富翁</title>
    <style>
        /* 核心配色：#EA7500, #000000, #FF8000 */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 畫面切換容器 - 徹底修正遮擋問題 */
        .screen {
            display: none; /* 預設完全不佔空間、不遮擋 */
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
            width: 100%;
        }

        .screen.active {
            display: flex; /* 只有激活的頁面才會出現 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- 1. 開始頁面樣式 --- */
        #start-screen {
            text-align: center;
            z-index: 10;
        }

        .banner {
            font-size: 90px;
            color: #EA7500;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 20px;
            text-shadow: 0 0 20px rgba(234, 117, 0, 0.7);
        }

        .sub-banner {
            font-size: 26px;
            color: #FF8000;
            margin-bottom: 40px;
            font-weight: bold;
        }

        /* --- 2. 遊戲中頁面樣式 --- */
        h1 {
            color: #FF8000;
            border: 3px double #EA7500;
            padding: 10px 30px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .game-container {
            display: flex;
            gap: 40px;
            background-color: #000000;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #EA7500;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(4, 110px);
            grid-template-rows: repeat(4, 110px);
            gap: 12px;
        }

        .cell {
            background-color: #000000;
            border: 3px solid #FF8000;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #FF8000;
            box-sizing: border-box;
        }

        .center-area {
            grid-column: 2 / 4; grid-row: 2 / 4;
            border: 2px dashed #EA7500;
            color: #EA7500;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        .cell.go { background-color: #EA7500; color: #000; }
        .cell.chance { border-color: #EA7500; color: #EA7500; }
        .cell.plus { color: #32FF32; }
        .cell.minus { color: #FF3232; }

        .players-in-cell { display: flex; gap: 4px; font-size: 20px; }

        .side-panel {
            width: 320px;
            border-left: 3px double #EA7500;
            padding-left: 30px;
        }

        .panel-title {
            background-color: #FF8000; color: #000;
            padding: 8px; font-weight: bold; text-align: center; border-radius: 4px; margin-bottom: 15px;
        }

        .player-row {
            padding: 10px; margin-bottom: 10px; border: 1px solid #EA7500;
            border-radius: 6px; display: flex; align-items: center; gap: 10px;
            background-color: rgba(234, 117, 0, 0.05);
        }

        .player-row.active {
            border: 2px solid #FF8000; background-color: rgba(255, 128, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 128, 0, 0.4);
        }

        .controls { margin-top: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }

        #log-window {
            width: 100%; max-width: 800px; height: 100px; background-color: #000;
            border: 1px solid #EA7500; padding: 12px; overflow-y: auto; font-size: 14px;
            box-sizing: border-box; line-height: 1.6;
        }

        .arrow-indicator { color: #EA7500; font-size: 11px; margin-top: 2px; }

        /* --- 3. 結束頁面樣式 --- */
        #end-screen {
            text-align: center;
            background-color: rgba(234, 117, 0, 0.1);
            padding: 50px;
            border-radius: 20px;
            border: 5px double #FF8000;
            z-index: 10;
        }

        .winner-announcement {
            font-size: 32px;
            color: #FFFFFF;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .winner-display {
            font-size: 100px;
            margin: 20px 0;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* 通用按鈕樣式 */
        button {
            background-color: #FF8000;
            color: #000000;
            border: none;
            padding: 15px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 128, 0, 0.4);
        }

        button:hover {
            background-color: #EA7500;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <div class="banner">飛べ</div>
        <div class="sub-banner">🏐 烏野三年級生：全國大賽大富翁 🏐</div>
        <button onclick="switchScreen('game-screen')">進入體育館 (開始遊戲)</button>
    </div>

    <div id="game-screen" class="screen">
        <h1>🏐 全國大賽集訓中... </h1>
        <div class="game-container">
            <div class="map-grid" id="map"></div>
            <div class="side-panel">
                <div class="panel-title">📝 目前角色位子</div>
                <div id="player-list"></div>
            </div>
        </div>
        <div class="controls">
            <button id="roll-btn" onclick="playTurn()">🎲 擲骰子前進</button>
            <div id="log-window"></div>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <div class="winner-announcement">🏆 比賽結束！優勝者是 🏆</div>
        <div id="winner-info" class="winner-display"></div>
        <div id="winner-name" style="font-size: 36px; color: #FF8000; margin-bottom: 40px; font-weight: bold;"></div>
        <button onclick="resetGame()">重新集訓 (再來一場)</button>
    </div>
