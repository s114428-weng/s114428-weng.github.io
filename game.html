<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排球少年！烏野三年級生飛吧！全國大賽大富翁</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏐</text></svg>">

    <style>
        /* 核心配色：#EA7500, #000000, #FF8000 */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* 畫面切換容器 */
        .screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
        }

        .screen.active {
            display: flex;
        }

        /* --- 1. 開始頁面樣式 --- */
        #start-screen {
            text-align: center;
            padding-top: 10vh;
        }

        .banner {
            font-size: 100px;
            color: #EA7500;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 20px;
            text-shadow: 0 0 25px rgba(234, 117, 0, 0.8);
        }

        .sub-banner {
            font-size: 26px;
            color: #FF8000;
            margin-bottom: 50px;
            font-weight: bold;
        }

        /* --- 新增：選角設定頁面樣式 --- */
        #setup-screen {
            text-align: center;
            padding-top: 5vh;
        }

        .setup-container {
            background-color: rgba(234, 117, 0, 0.05);
            border: 2px solid #EA7500;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .setup-row {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }

        .btn-group button {
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 20px;
            margin: 0 5px;
            display: inline-block;
        }

        .btn-group button.selected {
            background-color: #EA7500;
            color: #000;
            border-color: #FF8000;
        }

        .character-select-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            border-top: 1px dashed #EA7500;
            padding-top: 20px;
        }

        select {
            background-color: #000;
            color: #FF8000;
            border: 2px solid #EA7500;
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #FF8000;
        }

        /* --- 2. 遊戲中頁面樣式 --- */
        h1 {
            color: #FF8000;
            border: 3px double #EA7500;
            padding: 10px 30px;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .game-container {
            display: flex;
            gap: 40px;
            background-color: #000000;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #EA7500;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(6, 110px);
            grid-template-rows: repeat(4, 110px);
            gap: 12px;
        }

        .cell {
            background-color: #000000;
            border: 3px solid #FF8000;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #FF8000;
            box-sizing: border-box;
        }

        .center-area {
            grid-column: 2 / 6; 
            grid-row: 2 / 4;
            border: 2px dashed #EA7500;
            border-radius: 8px;
            color: #EA7500;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background-color: rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .center-volleyball {
            font-size: 65px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 8px rgba(255, 128, 0, 0.6));
            animation: pulseBall 2s infinite alternate;
        }

        @keyframes pulseBall {
            from { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255, 128, 0, 0.5)); }
            to { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(255, 128, 0, 0.9)); }
        }

        .cell.go { background-color: #EA7500; color: #000; }
        .cell.chance { border-color: #EA7500; color: #EA7500; }
        .cell.plus { color: #32FF32; }
        .cell.minus { color: #FF3232; }

        .players-in-cell { display: flex; gap: 4px; font-size: 20px; flex-wrap: wrap; justify-content: center; }

        .side-panel {
            width: 300px;
            border-left: 3px double #EA7500;
            padding-left: 30px;
        }

        .panel-title {
            background-color: #FF8000; color: #000;
            padding: 8px; font-weight: bold; text-align: center; border-radius: 4px; margin-bottom: 15px;
