<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排球少年！烏野三年級生飛吧！全國大賽大富翁</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏐</text></svg>">

    <style>
        /* 核心配色：#EA7500, #000000, #FF8000 */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* 畫面切換容器 */
        .screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1100px;
        }

        .screen.active {
            display: flex;
        }

        /* --- 1. 開始頁面樣式 --- */
        #start-screen {
            text-align: center;
            padding-top: 10vh;
        }

        .banner {
            font-size: 100px;
            color: #EA7500;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 20px;
            text-shadow: 0 0 25px rgba(234, 117, 0, 0.8);
        }

        .sub-banner {
            font-size: 26px;
            color: #FF8000;
            margin-bottom: 50px;
            font-weight: bold;
        }

        /* --- 選角設定頁面樣式 --- */
        #setup-screen {
            text-align: center;
            padding-top: 5vh;
        }

        .setup-container {
            background-color: rgba(234, 117, 0, 0.05);
            border: 2px solid #EA7500;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        .setup-row {
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }

        .btn-group button {
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 20px;
            margin: 0 5px;
            display: inline-block;
        }

        .btn-group button.selected {
            background-color: #EA7500;
            color: #000;
            border-color: #FF8000;
        }

        .character-select-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            border-top: 1px dashed #EA7500;
            padding-top: 20px;
        }

        select {
            background-color: #000;
            color: #FF8000;
            border: 2px solid #EA7500;
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #FF8000;
        }

        /* --- 2. 遊戲中頁面樣式 --- */
        h1 {
            color: #FF8000;
            border: 3px double #EA7500;
            padding: 10px 30px;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
        }

        .game-container {
            display: flex;
            gap: 40px;
            background-color: #000000;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #EA7500;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(6, 110px);
            grid-template-rows: repeat(4, 110px);
            gap: 12px;
        }

        .cell {
            background-color: #000000;
            border: 3px solid #FF8000;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #FF8000;
            box-sizing: border-box;
        }

        /* 🏐 中央球場大改動：變成可點擊的互動區域 */
        .center-area {
            grid-column: 2 / 6; 
            grid-row: 2 / 4;
            border: 2px dashed #EA7500;
            border-radius: 8px;
            color: #EA7500;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* 🎲 骰子/排球本體按鈕 */
        .dice-ball {
            font-size: 65px;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 0 10px rgba(255, 128, 0, 0.6));
            transition: transform 0.1s;
            margin-bottom: 5px;
        }

        .dice-ball:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 18px rgba(255, 128, 0, 0.9));
        }

        /* 🎬 擲骰子時的瘋狂旋轉排球動畫 */
        .dice-ball.rolling {
            animation: crazyRoll 0.15s infinite alternate;
            pointer-events: none; /* 滾動中禁止重複點擊 */
        }

        @keyframes crazyRoll {
            0% { transform: scale(0.9) rotate(0deg); filter: drop-shadow(0 0 5px #EA7500); }
            100% { transform: scale(1.2) rotate(360deg); filter: drop-shadow(0 0 25px #FF8000); }
        }

        /* 📢 骰完後秀出的大字步數通知 */
        .steps-overlay {
            font-size: 32px;
            color: #32FF32;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(50, 255, 50, 0.8);
            animation: popIn 0.5s ease-out forwards;
            margin-bottom: 5px;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.go { background-color: #EA7500; color: #000; }
        .cell.chance { border-color: #EA7500; color: #EA7500; }
        .cell.plus { color: #32FF32; }
        .cell.minus { color: #FF3232; }

        .players-in-cell { display: flex; gap: 4px; font-size: 20px; flex-wrap: wrap; justify-content: center; }

        .side-panel {
            width: 300px;
            border-left: 3px double #EA7500;
            padding-left: 30px;
        }

        .panel-title {
            background-color: #FF8000; color: #000;
            padding: 8px; font-weight: bold; text-align: center; border-radius: 4px; margin-bottom: 15px;
        }

        .player-row {
            padding: 10px; margin-bottom: 10px; border: 1px solid #EA7500;
            border-radius: 6px; display: flex; align-items: center; gap: 10px;
            background-color: rgba(234, 117, 0, 0.05);
        }

        .player-row.active {
            border: 2px solid #FF8000; background-color: rgba(255, 128, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 128, 0, 0.4);
        }

        .controls { 
            margin-top: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            width: 100%; 
        }

        #log-window {
            width: 100%; max-width: 990px; background-color: #000;
            border: 1px solid #EA7500; border-radius: 6px; padding: 12px; 
            height: 100px; overflow-y: auto; font-size: 14px;
            box-sizing: border-box; line-height: 1.6;
        }

        .arrow-indicator { color: #EA7500; font-size: 11px; margin-top: 2px; }

        /* --- 3. 結束頁面樣式 --- */
        #end-screen {
            text-align: center;
            background-color: rgba(234, 117, 0, 0.1);
            padding: 50px;
            border-radius: 20px;
            border: 5px double #FF8000;
            margin-top: 5vh;
        }

        .winner-announcement {
            font-size: 32px;
            color: #FFFFFF;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .winner-display {
            font-size: 100px;
            margin: 20px 0;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        button {
            background-color: #FF8000;
            color: #000000;
            border: 3px solid #EA7500;
            padding: 18px 60px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 20px rgba(255, 128, 0, 0.5);
            display: block;
            margin: 10px auto;
        }

        button:hover {
            background-color: #EA7500;
            border-color: #FF8000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <div class="banner">飛べ</div>
        <div class="sub-banner">🏐 烏野三年級生：全國大賽大富翁 🏐</div>
        <button onclick="goToSetupScreen()">進入體育館</button>
    </div>

    <div id="setup-screen" class="screen">
        <div class="banner" style="font-size: 60px;">成員召集</div>
        <div class="setup-container">
            <div class="setup-row">
                <span>選擇參與人數：</span>
                <div class="btn-group">
                    <button id="btn-p2" onclick="setPlayerCount(2)" class="selected">2 人</button>
                    <button id="btn-p3" onclick="setPlayerCount(3)">3 人</button>
                    <button id="btn-p4" onclick="setPlayerCount(4)">4 人</button>
                </div>
            </div>
            <div class="character-select-area" id="selectors-wrapper">
                </div>
        </div>
        <button onclick="startGameFlow()">確認陣容！出征全國大賽</button>
    </div>

    <div id="game-screen" class="screen">
        <h1>🏐 全國大賽集訓中... </h1>
        <div class="game-container">
            <div class="map-grid" id="map"></div>
            <div class="side-panel">
                <div class="panel-title">📝 目前角色位子</div>
                <div id="player-list"></div>
            </div>
        </div>
        <div class="controls">
            <div style="color: #FF8000; font-size: 18px; font-weight: bold; letter-spacing: 2px;" id="turn-indicator-text"></div>
            <div id="log-window"></div>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <div class="winner-announcement">🏆 比賽結束！優勝者是 🏆</div>
        <div id="winner-info" class="winner-display"></div>
        <div id="winner-name" style="font-size: 36px; color: #FF8000; margin-bottom: 40px; font-weight: bold;"></div>
        <button onclick="resetGameFlow()">重新集訓 (再來一場)</button>
    </div>

<script>
    const gridMapping = [
        {idx: 0, r: 4, c: 1, label: "GO", type: "go"},
        {idx: 1, r: 4, c: 2, label: "+200", type: "plus", val: 200},
        {idx: 2, r: 4, c: 3, label: "+500", type: "plus", val: 500},
        {idx: 3, r: 4, c: 4, label: "-300", type: "minus", val: -300},
        {idx: 4, r: 4, c: 5, label: "+150", type: "plus", val: 150},
        {idx: 5, r: 4, c: 6, label: "-100", type: "minus", val: -100}, 
        {idx: 6, r: 3, c: 6, label: "+200", type: "plus", val: 200},
        {idx: 7, r: 2, c: 6, label: "-600", type: "minus", val: -600},
        {idx: 8, r: 1, c: 6, label: "+150", type: "plus", val: 150}, 
        {idx: 9, r: 1, c: 5, label: "Chance", type: "chance"},
        {idx: 10, r: 1, c: 4, label: "Chance", type: "chance"},
        {idx: 11, r: 1, c: 3, label: "+500", type: "plus", val: 500},
        {idx: 12, r: 1, c: 2, label: "-300", type: "minus", val: -300},
        {idx: 13, r: 1, c: 1, label: "+200", type: "plus", val: 200}, 
        {idx: 14, r: 2, c: 1, label: "Chance", type: "chance"},
        {idx: 15, r: 3, c: 1, label: "-600", type: "minus", val: -600}
    ];

    const chanceCards = [
        {text: "發動快攻！前進 1 步", value: 1},
        {text: "完美的接球！前進 2 步", value: 2},
        {text: "跳發得分！前進 3 步", value: 3},
        {text: "被對方攔網成功... 後退 2 步", value: -2},
        {text: "發球失誤送分。後退 3 步", value: -3},
        {text: "輪轉站位錯誤！大迷路後退 5 步", value: -5}
    ];

    const characterPool = [
        {name: "澤村大地", icon: "🏔️"},
        {name: "菅原孝之", icon: "😊"},
        {name: "東峰旭",   icon: "🧔"},
        {name: "清水潔子", icon: "✨"}
    ];

    let selectedCount = 2; 
    let players = [];
    let currentTurn = 0;
    let gameOver = false;
    let isRolling = false; // 骰子動畫狀態鎖

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToSetupScreen() {
        switchScreen('setup-screen');
        setPlayerCount(2); 
    }

    function setPlayerCount(count) {
        selectedCount = count;
        document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('selected'));
        const activeBtn = document.getElementById(`btn-p${count}`);
        if(activeBtn) activeBtn.classList.add('selected');
        
        const wrapper = document.getElementById('selectors-wrapper');
        if (!wrapper) return;
        wrapper.innerHTML = '';
        
        for (let i = 1; i <= count; i++) {
            const row = document.createElement('div');
            row.className = 'setup-row';
            
            let optionsHTML = '';
            characterPool.forEach((char, index) => {
                const isSelected = (index === (i - 1) % characterPool.length) ? 'selected' : '';
                optionsHTML += `<option value="${index}" ${isSelected}>${char.icon} ${char.name}</option>`;
            });

            row.innerHTML = `<span>玩家 Player ${i}：</span>
                             <select id="p-select-${i}" onchange="checkDuplicateSelection(${i}, this)">${optionsHTML}</select>`;
            wrapper.appendChild(row);
        }
    }

    function checkDuplicateSelection(currentPlayerNum, selectElement) {
        const currentVal = selectElement.value;
        for (let i = 1; i <= selectedCount; i++) {
            if (i === currentPlayerNum) continue;
            const otherSelect = document.getElementById(`p-select-${i}`);
            if (otherSelect && otherSelect.value === currentVal) {
                alert(`⚠️ 撞角啦！【${characterPool[currentVal].icon} ${characterPool[currentVal].name}】已經被 Player ${i} 選走了！請選擇其他三年級夥伴。`);
                let safeIndex = 0;
                const pickedIndices = [];
                for (let j = 1; j <= selectedCount; j++) {
                    if (j === currentPlayerNum) continue;
                    const el = document.getElementById(`p-select-${j}`);
                    if(el) pickedIndices.push(parseInt(el.value));
                }
                for (let k = 0; k < characterPool.length; k++) {
                    if (!pickedIndices.includes(k)) { safeIndex = k; break; }
                }
                selectElement.value = safeIndex;
                return;
            }
        }
    }

    function startGameFlow() {
        players = [];
        for (let i = 1; i <= selectedCount; i++) {
            const selectEl = document.getElementById(`p-select-${i}`);
            if(!selectEl) continue;
            const charIndex = parseInt(selectEl.value);
            const baseChar = characterPool[charIndex];
            players.push({ id: i - 1, name: baseChar.name, icon: baseChar.icon, pos: 0, money: 300 });
        }
        
        currentTurn = 0;
        gameOver = false;
        isRolling = false;
        
        document.getElementById('log-window').innerHTML = `🏐 進入體育館！比賽開始。<br>👉 請點擊球場中央的排球為【${players[0].name}】發球擲骰子！`;
        
        switchScreen('game-screen');
        renderGame();
    }

    // 核心渲染：包含互動骰子的狀態切換
    function renderGame(rolledDiceValue = null) {
        const mapEl = document.getElementById('map');
        if(!mapEl) return;
        mapEl.innerHTML = '';
        
        // 1. 渲染外圍格子
        gridMapping.forEach(cell => {
            const div = document.createElement('div');
            div.className = `cell ${cell.type}`;
            div.style.gridRow = cell.r; div.style.gridColumn = cell.c;
            div.innerHTML = `<div>${cell.label}</div>`;
            if(cell.idx === 0) div.innerHTML += `<div class="arrow-indicator">▲ 前進</div>`;
            
            const pContainer = document.createElement('div');
            pContainer.className = 'players-in-cell';
            players.forEach(p => { if(p.pos === cell.idx) pContainer.innerHTML += p.icon; });
            div.appendChild(pContainer);
            mapEl.appendChild(div);
        });

        // 2. 建立中央互動球場區
        const center = document.createElement('div');
        center.className = 'center-area';
        
        const activePlayer = players[currentTurn];

        // 智慧判斷中央是要秀出「排球骰子」還是「點數結果」
        if (rolledDiceValue) {
            // 秀出甩骰後的步數結果
            center.innerHTML = `<div class="steps-overlay">🎲 前進 ${rolledDiceValue} 步！</div>`;
        } else {
            // 等待玩家點按的發球排球骰子
            const ball = document.createElement('div');
            ball.className = `dice-ball ${isRolling ? 'rolling' : ''}`;
            ball.innerText = '🏐';
            // 綁定中央點擊事件
            ball.onclick = startRollDice;
            center.appendChild(ball);
        }

        center.innerHTML += `<strong style="color:#EA7500; letter-spacing:4px; font-size:20px;">飛 吧！</strong>
                             <span style="font-size:13px; margin-top:2px; color:#FF8000; letter-spacing:2px;">烏野高校排球部</span>`;
        mapEl.appendChild(center);

        // 3. 提示目前輪到誰
        document.getElementById('turn-indicator-text').innerHTML = gameOver ? "🏆 比賽結束 🏆" : `👉 輪到 <strong>${activePlayer.icon} ${activePlayer.name}</strong> 的回合！請點按中央排球發球！`;

        // 4. 渲染右側欄
        const listEl = document.getElementById('player-list');
        if(!listEl) return;
        listEl.innerHTML = '';
        players.forEach((p, i) => {
            const row = document.createElement('div');
            row.className = `player-row ${i === currentTurn && !gameOver ? 'active' : ''}`;
            const posText = p.pos === 0 ? "START" : `第 ${p.pos} 格`;
            row.innerHTML = `<div style="width:20px; color:#FF8000; font-weight:bold;">${i === currentTurn && !gameOver ? '★' : ''}</div>
                             <div><strong>${p.icon} ${p.name}</strong><br>
                             <span style="font-size:12px; color:#aaa;">資產: ${p.money} 元 | 位置: ${posText}</span></div>`;
            listEl.appendChild(row);
        });
    }

    // 🎬 觸發擲骰旋轉動畫
    function startRollDice() {
        if (gameOver || isRolling) return;
        isRolling = true;
        
        // 重新渲染，讓排球加上 .rolling 開始瘋狂轉動
        renderGame(); 

        // 模擬 1 秒鐘的激烈擊球轉動後開獎
        setTimeout(() => {
            executeMoveLogic();
        }, 1000);
    }

    // 🧮 轉完後真正的點數計算與前進邏輯
    function executeMoveLogic() {
        const p = players[currentTurn];
        const log = document.getElementById('log-window');
        
        const dice = Math.floor(Math.random() * 6) + 1; // 隨機 1 ~ 6 步
        
        // 1. 先展示步數大字成果，不切換下一棒
        isRolling = false;
        renderGame(dice); 

        // 2. 延遲 0.8 秒等玩家看完大字後，角色再出發並結算格子事件
        setTimeout(() => {
            p.pos += dice;
            if (p.pos >= 16) { p.money += 100; p.pos %= 16; } // 繞一圈加分
            
            let cell = gridMapping.find(c => c.idx === p.pos);
            let logMsg = `🎲 <strong>${p.icon} ${p.name}</strong> 完美發球！擲出 <span style="color:#32FF32; font-weight:bold;">${dice}</span> 點，前進至第 ${p.pos} 格（${cell.label}）。`;

            if (cell.type === 'chance') {
                const card = chanceCards[Math.floor(Math.random() * chanceCards.length)];
                logMsg += `<br>✨ 踩到機會！抽卡：【<strong>${card.text}</strong>】`;
                p.pos = (p.pos + card.value + 16) % 16;
                cell = gridMapping.find(c => c.idx === p.pos);
                logMsg += ` 位置變更為第 ${p.pos} 格。`;
            }

            if (cell.val) p.money += cell.val;
            if (p.money < 0) p.money = 0;

            log.innerHTML = logMsg + `<br>💰 目前資產：<strong>${p.money}</strong> 元。`;

            // 判斷是否獲勝
            if (p.money >= 1200) {
                showEndScreen(p);
                return;
            }

            // 換下一位玩家，並回復成普通的排球等待點擊狀態
            currentTurn = (currentTurn + 1) % players.length;
            renderGame();
            log.scrollTop = log.scrollHeight;
        }, 800);
    }

    function showEndScreen(winner) {
        gameOver = true;
        document.getElementById('winner-info').innerText = winner.icon;
        document.getElementById('winner-name').innerText = winner.name;
        switchScreen('end-screen');
    }

    function resetGameFlow() {
        players = [];
        currentTurn = 0;
        gameOver = false;
        isRolling = false;
        goToSetupScreen();
    }
</script>

</body>
</html>
