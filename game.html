<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排球少年！烏野三年級生飛吧！全國大賽大富翁</title>
    <style>
        /* 完全採用用戶指定的三色：#EA7500, #000000, #FF8000 */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #FF8000;
            background-color: #000000;
            border: 3px double #EA7500;
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 15px rgba(234, 117, 0, 0.5);
            margin-bottom: 20px;
        }

        .game-container {
            display: flex;
            gap: 40px;
            background-color: #000000;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #EA7500;
        }

        /* 4x4 逆時針環狀地圖佈局 */
        .map-grid {
            display: grid;
            grid-template-columns: repeat(4, 110px);
            grid-template-rows: repeat(4, 110px);
            gap: 12px;
        }

        .cell {
            background-color: #000000;
            border: 3px solid #FF8000;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #FF8000;
            position: relative;
            box-sizing: border-box;
        }

        /* 內圈裝飾線與中央「飛吧」標語 */
        .center-area {
            grid-column: 2 / 4;
            grid-row: 2 / 4;
            border: 2px dashed #EA7500;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #EA7500;
            font-size: 24px;
            letter-spacing: 4px;
        }

        /* 特殊格子顏色 */
        .cell.go {
            background-color: #EA7500;
            color: #000000;
            border-color: #FF8000;
        }
        .cell.chance {
            border-color: #EA7500;
            color: #EA7500;
        }
        .cell.plus { color: #32FF32; }
        .cell.minus { color: #FF3232; }

        .players-in-cell {
            display: flex;
            gap: 4px;
            font-size: 20px;
            margin-top: 5px;
        }

        /* 右側「目前角色位子」資訊面板 */
        .side-panel {
            width: 320px;
            border-left: 3px double #EA7500;
            padding-left: 30px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            color: #000000;
            background-color: #FF8000;
            padding: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .player-row {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #EA7500;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(234, 117, 0, 0.05);
        }

        .player-row.active {
            border: 2px solid #FF8000;
            background-color: rgba(255, 128, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 128, 0, 0.4);
        }

        .star-marker {
            color: #FF8000;
            font-size: 18px;
            width: 20px;
        }

        /* 遊戲操控按鈕與日誌 */
        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        button {
            background-color: #FF8000;
            color: #000000;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 128, 0, 0.3);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #EA7500;
            transform: scale(1.05);
        }

        #log-window {
            width: 100%;
            max-width: 800px;
            height: 120px;
            background-color: #000000;
            border: 1px solid #EA7500;
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 14px;
            color: #DDDDDD;
            line-height: 1.6;
        }
        
        .arrow-indicator {
            color: #EA7500;
            font-size: 12px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h1>🏐 排球少年！烏野三年級生飛吧！全國大賽大富翁 </h1>

    <div class="game-container">
        <div class="map-grid" id="map">
            </div>

        <div class="side-panel">
            <div class="panel-title">📝 目前角色位子</div>
            <div id="player-list">
                </div>
        </div>
    </div>

    <div class="controls">
        <button id="roll-btn" onclick="playTurn()">🎲 擲骰子前進</button>
        <div id="log-window">歡迎來到烏野高中體育館！請點擊按鈕開始比賽！</div>
    </div>

<script>
    // 1. 初始化地圖資料 (索引0為左下GO，依照逆時針排序至15)
    // 4x4 網格位置映射 (為了在畫面上呈現逆時針閉合)
    const gridMapping = [
        {idx: 0, r: 4, c: 1, label: "GO", type: "go"},
        {idx: 1, r: 4, c: 2, label: "+200", type: "plus", val: 200},
        {idx: 2, r: 4, c: 3, label: "+500", type: "plus", val: 500},
        {idx: 3, r: 4, c: 4, label: "-300", type: "minus", val: -300},
        {idx: 4, r: 3, c: 4, label: "+150", type: "plus", val: 150},
        {idx: 5, r: 2, c: 4, label: "-100", type: "minus", val: -100},
        {idx: 6, r: 1, c: 4, label: "+200", type: "plus", val: 200},
        {idx: 7, r: 1, c: 3, label: "-600", type: "minus", val: -600},
        {idx: 8, r: 1, c: 2, label: "+150", type: "plus", val: 150},
        {idx: 9, r: 1, c: 1, label: "Chance", type: "chance"},
        {idx: 10, r: 2, c: 1, label: "Chance", type: "chance"}, // 右下固定機會
        {idx: 11, r: 3, c: 1, label: "+500", type: "plus", val: 500},
        {idx: 12, r: 3, c: 2, label: "-300", type: "minus", val: -300},
        {idx: 13, r: 3, c: 3, label: "+200", type: "plus", val: 200},
        {idx: 14, r: 2, c: 3, label: "Chance", type: "chance"},
        {idx: 15, r: 2, c: 2, label: "-600", type: "minus", val: -600}
    ];

    // 機會卡設定
    const chanceCards = [
        {text: "發動快攻！前進 1 步", value: 1},
        {text: "完美的接球！前進 2 步", "value": 2},
        {text: "跳發得分！前進 3 步", "value": 3},
        {text: "被對方攔網成功... 後退 2 步", "value": -2},
        {text: "發球失誤送分。後退 3 步", "value": -3},
        {text: "輪轉站位錯誤！大迷路後退 5 步", "value": -5}
    ];

    // 2. 玩家角色設定
    const players = [
        {id: 0, name: "澤村大地", icon: "🏔️", pos: 0, money: 300},
        {id: 1, name: "菅原孝之", icon: "😊", pos: 0, money: 300},
        {id: 2, name: "東峰旭",   icon: "🧔", pos: 0, money: 300},
        {id: 3, name: "清水潔子", icon: "✨", pos: 0, money: 300}
    ];

    let currentTurn = 0;
    let gameOver = false;

    // 3. 渲染地圖
    function renderGame() {
        const mapEl = document.getElementById('map');
        mapEl.innerHTML = '';

        // 填入格子
        gridMapping.forEach(cell => {
            const div = document.createElement('div');
            div.className = `cell ${cell.type}`;
            div.style.gridRow = cell.r;
            div.style.gridColumn = cell.c;

            // 顯示格子名字
            const title = document.createElement('div');
            title.innerText = cell.label;
            div.appendChild(title);

            // 如果是起點，加上方向箭頭
            if(cell.idx === 0) {
                const arr = document.createElement('div');
                arr.className = 'arrow-indicator';
                arr.innerText = '▲ (前進)';
                div.appendChild(arr);
            }

            // 放入停留在此格子的玩家頭像
            const pContainer = document.createElement('div');
            pContainer.className = 'players-in-cell';
            players.forEach(p => {
                if(p.pos === cell.idx) {
                    pContainer.innerHTML += p.icon;
                }
            });
            div.appendChild(pContainer);
            mapEl.appendChild(div);
        });

        // 補上中央的「飛吧」區域
        const center = document.createElement('div');
        center.className = 'center-area';
        center.innerHTML = '<strong>飛 吧！</strong><span style="font-size:14px; margin-top:5px; color:#FF8000;">烏野高校排球部</span>';
        mapEl.appendChild(center);

        // 4. 渲染右側「目前角色位子」面板 (完美對應草稿 ★)
        const listEl = document.getElementById('player-list');
        listEl.innerHTML = '';
        players.forEach((p, i) => {
            const row = document.createElement('div');
            row.className = `player-row ${i === currentTurn && !gameOver ? 'active' : ''}`;

            const star = document.createElement('div');
            star.className = 'star-marker';
            star.innerText = (i === currentTurn && !gameOver) ? '★' : '';

            const info = document.createElement('div');
            const posText = p.pos === 0 ? "START" : `第 ${p.pos} 格`;
            info.innerHTML = `<strong>${i+1}. ${p.icon} ${p.name}</strong><br><span style="font-size:12px; color:#aaa;">位置: ${posText} | 資產: ${p.money} 元</span>`;

            row.appendChild(star);
            row.appendChild(info);
            listEl.appendChild(row);
        });
    }

    // 5. 核心遊戲邏輯：回合行進
    function playTurn() {
        if (gameOver) return;

        const p = players[currentTurn];
        const log = document.getElementById('log-window');
        
        // 擲骰子 1~6
        const dice = Math.floor(Math.random() * 6) + 1;
        let newPos = p.pos + dice;
        let msg = `🎲 <strong>${p.icon} ${p.name}</strong> 擲出了 <span style="color:#FF8000">${dice}</span> 點！`;

        // 判斷繞場一圈
        if (newPos >= 16) {
            p.money += 100;
            msg += ` 💰 繞場一圈，獲得精神應援 100 元！`;
        }
        
        p.pos = newPos % 16;
        let currentCell = gridMapping.find(c => c.idx === p.pos);
        msg += ` 移動至第 ${p.pos} 格（${currentCell.label}）。`;

        // 處理格子事件
        if (currentCell.type === 'chance') {
            const card = chanceCards[Math.floor(Math.random() * chanceCards.length)];
            msg += `<br>✨ 踩到機會格！抽卡結果：【<strong>${card.text}</strong>】`;
            
            let chancePos = p.pos + card.value;
            if (card.value > 0 && chancePos >= 16) {
                p.money += 100;
                msg += ` 💰 跨越起點，獲得應援 100 元！`;
            }
            if (chancePos < 0) chancePos = 16 + chancePos;
            p.pos = chancePos % 16;
            
            // 重新讀取機會移動後的格子
            currentCell = gridMapping.find(c => c.idx === p.pos);
            msg += ` 🚀 位置變更為第 ${p.pos} 格。`;
        }

        // 金錢格結算
        if (currentCell.val) {
            p.money += currentCell.val;
            if (p.money < 0) p.money = 0;
            
            if (currentCell.val > 0) {
                msg += ` 💵 獲得 <span style="color:#32FF32">${currentCell.val}</span> 元。`;
            } else {
                msg += ` 💸 失去 <span style="color:#FF3232">${Math.abs(currentCell.val)}</span> 元。`;
            }
        } else if (p.pos === 0) {
            msg += ` 在休息區儲備體力。`;
        }

        msg += ` 目前總資產：<strong>${p.money}</strong> 元。`;
        log.innerHTML = msg;

        // 判斷獲勝條件（1200元）
        if (p.money >= 1200) {
            gameOver = true;
            log.innerHTML += `<br><br><span style="font-size:18px; color:#FF8000;">🎉 🎉 🎉 飛吧！比賽結束！恭喜 【${p.icon} ${p.name}】 贏得終極勝利！</span>`;
            document.getElementById('roll-btn').disabled = true;
            document.getElementById('roll-btn').innerText = '🏆 遊戲結束 🏆';
            renderGame();
            return;
        }

        // 輪到下一位玩家
        currentTurn = (currentTurn + 1) % players.length;
        renderGame();
        
        // 自動捲動日誌窗
        log.scrollTop = log.scrollHeight;
    }

    // 初始化啟動
    renderGame();
</script>

</body>
</html>
